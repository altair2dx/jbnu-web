<!DOCTYPE html>
<body>
    <script>
        // var a = [2, 4, 6];
        // document.write(`${a} <br>`);
        // var a = [1, 3, 5];
        // document.write(`${a} <br>`);
        n = 5;
        a = [];
        for (i=0; i<n; i++) {
            r = Math.trunc(Math.random() * 9 + 1);
            a.push(r);
        }

        for (i=0; i<n; i++) {
            document.write(`${a[i]} `);
        }
        document.write("<br>");
        
        for (i of a) {
            document.write(`${i} `);
        }
        document.write("<br>");

        i = 0;
        while (i < n) {
            document.write(`${a[i]} `);
            i++;
        }
    </script>
</body>
</html>
