<!DOCTYPE html>
<body>
    <script>
        function prtMat(m) {
            for (i=0; i<m.length; i++) {
                for (j=0; j<m[i].length; j++) {
                    document.write(m[i][j] + " ");
                }
                document.write("<br>");
            }
        }

        mt = [ [1,2,3], [4,5,6], [7,8,9]];
        prtMat(mt);
    </script>
</body>
</html>
