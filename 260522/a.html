<!DOCTYPE html>
<body>
    <script>
        function sq(k) {
            return k*k
        }
    </script>
    <script>
        n = parseInt(prompt("Enter Number of Array:", 5));
        arr = [];
        
        for (i=0; i<n; i++) {
            arr.push(Math.trunc(Math.random() * 30 + 1));
        }
        document.write(`${arr} <br>`);

        for (i=0; i<arr.length; i++) {
            document.write(`${sq(arr[i])} `);
        }
    </script>
</body>
</html>
