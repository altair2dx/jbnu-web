<!DOCTYPE html>
<body>
    <script>
        const user = new Object();
        user.name = "영희";
        user.age = 20;
        user.greet = function() {
            document.write("안녕하세요");
        }
        document.write(`${user.name} ${user.age}<br>`);
        user.greet();
    </script>
</body>
</html>
