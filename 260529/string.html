<!DOCTYPE html>
<body>
    <script>
        name = "Kim Gil Dong";
        name_b = " Kim Gil Dong ";
        document.write(`${name.length} <br>`);
        document.write(`${name.charAt(5)} <br>`);
        document.write(`$${name_b}$ <br>`);
        document.write(`$${name_b.trim()}$ <br>`);
        document.write(`${name.split(" ")} <br>`);
    </script>
</body>
</html>
